name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Unzip project
        run: |
          unzip -o *.zip -d proj
          echo "----- Extracted structure -----"
          find proj -maxdepth 5
      - name: Find and build
        run: |
          GRADLEW=$(find proj -maxdepth 6 -iname "gradlew" -type f | head -1)
          echo "Found gradlew at: $GRADLEW"
          if [ -z "$GRADLEW" ]; then
            echo "No gradlew found anywhere. Full listing:"
            find proj -maxdepth 8
            exit 1
          fi
          ROOT=$(dirname "$GRADLEW")
          cd "$ROOT" && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: proj/**/app/build/outputs/apk/debug/*.apk
