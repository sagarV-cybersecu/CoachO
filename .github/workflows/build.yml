name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Unzip project
        run: unzip -o *.zip -d proj
      - name: Locate project root
        id: find
        run: |
          GRADLE_FILE=$(find proj -maxdepth 4 -path "*/app/build.gradle*" | head -1)
          ROOT=$(dirname $(dirname "$GRADLE_FILE"))
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "Project root: $ROOT"
          ls -la "$ROOT"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        run: gradle -p "${{ steps.find.outputs.root }}" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: proj/**/app/build/outputs/apk/debug/*.apk
